[package]
name = "craft-android"
version = "0.1.0"
edition = "2021"
description = "Android runtime for Craft apps: GameActivity entry, JNI bridge (links, file picker, gallery saves)"
license = "MIT OR Apache-2.0"
publish = false

# The crate is empty on every other target, so it can sit in a workspace without affecting
# desktop or web builds. The eframe version below matches the workspace (0.37).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "android-game-activity", "persistence", "links"] }
jni = "0.21"
log = "0.4"
serde_json = "1"
# eframe's `NativeOptions::android_app` is typed with winit's re-export of `AndroidApp`.
winit = { version = "0.30", default-features = false, features = ["android-game-activity", "rwh_06"] }
